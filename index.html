<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUM10 — 3D Block Sliding Sum Puzzle</title>
    <meta name="description" content="A 3D block sliding puzzle game where you pair blocks that sum to 10 to launch them out of the tower.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="canvas-container"></div>

    <div class="hud-overlay">
        <!-- Top Consolidated Bar -->
        <header class="hud-top">
            <div class="brand-group">
                <div class="brand-badge">
                    <span class="brand-icon">⚡</span>
                    <span class="brand-name">SUM10</span>
                </div>
                <button id="btn-sound" class="btn-icon" type="button" title="Toggle Sound">
                    <span id="icon-sound">🔊</span>
                </button>
                <button id="btn-theme" class="btn-icon" type="button" title="Toggle Day/Night Mode">
                    <span id="icon-theme">🌙</span>
                </button>
                <button id="btn-retry" class="btn-icon" type="button" title="Restart Level">
                    <span>↺</span>
                </button>
            </div>

            <!-- Match Display in Top Bar -->
            <div class="selection-card">
                <div id="slot-1" class="selection-slot">?</div>
                <div class="selection-plus">+</div>
                <div id="slot-2" class="selection-slot">?</div>
                <div class="selection-equals">=</div>
                <div class="target-badge">10</div>
            </div>

            <div class="stats-group">
                <div id="pill-level" class="stat-pill clickable-pill" title="Tap to select level">
                    <span class="stat-label">LVL ▾</span>
                    <span id="val-level" class="stat-value">1</span>
                </div>
                <div class="stat-pill">
                    <span class="stat-label">PTS</span>
                    <span id="val-score" class="stat-value">0</span>
                </div>
                <div class="stat-pill">
                    <span class="stat-label">MOVES</span>
                    <span id="val-moves" class="stat-value">0</span>
                </div>
                <div class="stat-pill">
                    <span class="stat-label">LEFT</span>
                    <span id="val-remaining" class="stat-value">0</span>
                </div>
            </div>
        </header>

        <!-- Dynamic Floating Toast / Notification -->
        <div class="toast-wrapper">
            <div id="toast-msg" class="toast-msg">Select a block</div>
        </div>

        <!-- Bottom Controls (Clean, minimal, deadlock shuffle only) -->
        <footer class="hud-footer">
            <button id="btn-shuffle" class="btn-secondary" type="button" style="display: none;">
                <span>🌋 Shuffle</span>
            </button>
        </footer>
    </div>

    <!-- Level Select Modal -->
    <div id="modal-level-select" class="modal-backdrop" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h2 class="modal-title">Select Level</h2>
                <button id="btn-close-modal" class="btn-close" type="button">✕</button>
            </div>
            <p class="modal-subtitle">Choose from your unlocked levels:</p>
            <div id="level-grid" class="level-grid"></div>
        </div>
    </div>

    <!-- Level Complete Modal Overlay -->
    <div id="modal-level-complete" class="modal-backdrop" style="display: none;">
        <div class="modal-card level-complete-card">
            <div class="celebration-badge">🎉</div>
            <div id="complete-stars" class="complete-stars-banner">
                <span class="star-icon">★</span>
                <span class="star-icon">★</span>
                <span class="star-icon">★</span>
            </div>
            <div id="complete-rating-label" class="complete-rating-label">3 STARS • MASTER STRATEGIST!</div>
            <h2 id="complete-title" class="modal-title" style="text-align: center; margin-top: 6px;">Level 1 Cleared!</h2>
            <p id="complete-subtitle" class="modal-subtitle" style="text-align: center; margin-bottom: 20px;">Magnificent! The entire tower is dismantled.</p>

            <div class="complete-stats-grid">
                <div class="complete-stat-item">
                    <span class="complete-stat-label">MOVES (PAR)</span>
                    <span id="complete-val-moves" class="complete-stat-num">0 / 10</span>
                </div>
                <div class="complete-stat-item">
                    <span class="complete-stat-label">MAX COMBO</span>
                    <span id="complete-val-combo" class="complete-stat-num">1x</span>
                </div>
                <div class="complete-stat-item">
                    <span class="complete-stat-label">STAR BONUS</span>
                    <span id="complete-val-bonus" class="complete-stat-num" style="color: #059669;">+600</span>
                </div>
                <div class="complete-stat-item">
                    <span class="complete-stat-label">TOTAL SCORE</span>
                    <span id="complete-val-score" class="complete-stat-num" style="color: #0284c7;">0</span>
                </div>
            </div>

            <div class="complete-actions">
                <button id="btn-complete-replay" class="btn-outline-subtle" type="button">
                    <span>↺ Replay</span>
                </button>
                <button id="btn-complete-next" class="btn-primary" type="button" style="flex: 1; justify-content: center;">
                    <span>Next Level ➔</span>
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
